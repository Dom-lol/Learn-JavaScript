<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="card">
      <h1>Caluculate Grade</h1>

      <!-- name -->
      <label for="">Full Name</label>
      <input type="text" name="" id="nameinp" placeholder="Your Name:" />

      <!-- Math -->
      <label for="">Math score</label>
      <input type="text" name="" id="mathinp" placeholder="Score....." />

      <!-- Khmer -->
      <label for="">Khmer score</label>
      <input type="text" name="" id="khmerinp" placeholder="Score....." />

      <!-- code -->
      <label for="">Code score</label>
      <input type="text" name="" id="codeinp" placeholder="Score....." />

      <!-- database -->
      <label for="">Database score</label>
      <input type="text" name="" id="datainp" placeholder="Score....." />

      <!-- btn submit -->
      <div class="btnSubmit">
        <button id="submit">Submit</button>
      </div>
    </div>
    <div class="card2">
      <h1>Status</h1>
      <p id="fullName">Full Name:</p>
      <p id="math">math score:</p>
      <p id="code">Code Score:</p>
      <p id="khmer">Khmer Score:</p>
      <p id="database">Database Score:</p>
      <br />
      <p id="totalScore">Total Score:</p>
      <p id="result">Result:</p>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
